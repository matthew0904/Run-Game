<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>旋钮跑酷 · 飞越峡谷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #1a1a2e;
    color: #eee;
    font-family: "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 40px;
  }
  h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 14px; }
  h1 .sub { font-size: 14px; color: #888; letter-spacing: 0; margin-left: 8px; font-weight: normal; }
  .game-wrap { width: min(900px, 94vw); }
  canvas {
    width: 100%;
    display: block;
    border-radius: 12px;
    border: 1px solid #333;
    background: #16162a;
    cursor: pointer;
  }
  .panel { margin-top: 16px; text-align: center; }
  .value { font-size: 32px; font-weight: bold; color: #7ecbff; font-variant-numeric: tabular-nums; }
  .bar { width: min(420px, 80vw); height: 12px; background: #333; border-radius: 6px; margin: 14px auto 0; overflow: hidden; }
  .bar-fill {
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, #7ecbff, #4a9eff);
    transition: width 0.05s;
  }
  button {
    margin-top: 14px;
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #7ecbff;
    color: #1a1a2e;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #a8dcff; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 8px; font-size: 14px; color: #888; }
  .hint { margin-top: 10px; font-size: 13px; color: #666; line-height: 1.7; }
</style>
</head>
<body>

<h1>🎮 旋钮跑酷<span class="sub">转动旋钮，控制高度！</span></h1>

<div class="game-wrap"><canvas id="game" width="900" height="420"></canvas></div>

<div class="panel">
  <div>旋钮数值：<span class="value" id="val">--</span></div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <button id="connectBtn">连接 Arduino</button>
  <div id="status">未连接</div>
  <div class="hint">
    玩法：转动电位器（A3）控制 🏃 的飞行高度，穿过石墙缝隙得分，撞墙即结束。<br>
    未连接硬件时：按 <b>空格</b> / 点击画面开始，然后<b>上下移动鼠标</b>或按住 <b>↑ / ↓</b> 控制高度。
  </div>
</div>

<script>
'use strict';

/* ================= 可调参数 ================= */
const INVERT = false;    // 若旋钮转向与角色移动方向相反，改为 true
const W = 900, H = 420;
const PLAYER_X = 110;
const MARGIN = 36;       // 角色可到达的上下边界留白

/* ================= 画布 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

/* ================= DOM ================= */
const valEl = document.getElementById('val');
const barFill = document.getElementById('barFill');
const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connectBtn');

/* ================= 游戏状态 ================= */
let state = 'ready';  // ready | playing | dead
let player, walls, clouds;
let speed, distance, score;
let best = +(localStorage.getItem('knobParkourBest') || 0);
let distSinceSpawn, nextGap, gapH, lastGapCenter;

function resetWorld() {
  player = { y: H / 2, targetY: H / 2, emoji: '🏃' };
  walls = [];
  clouds = [
    { x: 200, y: 60,  s: 0.15 },
    { x: 560, y: 40,  s: 0.10 },
    { x: 800, y: 120, s: 0.20 },
  ];
  speed = 270; distance = 0; score = 0;
  distSinceSpawn = 0; nextGap = 480;
  gapH = 170; lastGapCenter = H / 2;
}
resetWorld();

function startGame() {
  if (state === 'playing') return;
  resetWorld();
  state = 'playing';
}

/* ================= 旋钮数值处理 =================
   0 ~ 1023 直接映射为角色目标高度（值大 = 飞得高） */
function handleValue(v, allowStart = true) {
  const ratio = INVERT ? 1 - v / 1023 : v / 1023;
  player.targetY = H - MARGIN - ratio * (H - 2 * MARGIN);

  valEl.textContent = v;
  barFill.style.width = (v / 1023 * 100) + '%';

  if (allowStart && state !== 'playing') startGame();
}

/* ================= 主循环 ================= */
let lastT = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 1000 || 0, 0.033);
  lastT = t;
  if (state === 'playing') update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  speed = Math.min(270 + score * 10, 500);      // 每过一墙加速
  gapH = Math.max(170 - score * 1.5, 116);       // 缝隙逐渐变窄
  distance += speed * dt;

  // 角色平滑跟随旋钮目标位置
  player.y += (player.targetY - player.y) * Math.min(1, dt * 12);

  // 石墙生成与移动
  distSinceSpawn += speed * dt;
  if (distSinceSpawn > nextGap) { spawnWall(); distSinceSpawn = 0; }
  for (const w of walls) w.x -= speed * dt;
  walls = walls.filter(w => w.x > -100);

  for (const c of clouds) {
    c.x -= speed * c.s * dt;
    if (c.x < -80) { c.x = W + 60; c.y = 30 + Math.random() * 120; }
  }

  // 过墙得分
  for (const w of walls) {
    if (!w.counted && w.x + w.w < PLAYER_X) { w.counted = true; score++; }
  }

  // 碰撞检测（判定盒比 emoji 略小，手感更宽容）
  const pb = { x: PLAYER_X - 13, y: player.y - 15, w: 26, h: 30 };
  for (const w of walls) {
    if (pb.x + pb.w > w.x && pb.x < w.x + w.w) {
      const gapTop = w.center - gapH / 2;
      const gapBottom = w.center + gapH / 2;
      if (pb.y < gapTop || pb.y + pb.h > gapBottom) { gameOver(); break; }
    }
  }
}

function spawnWall() {
  // 相邻缝隙中心不会跳得太远，保证转旋钮一定能赶到
  const minC = gapH / 2 + 20, maxC = H - gapH / 2 - 20;
  let center = lastGapCenter + (Math.random() * 2 - 1) * 190;
  center = Math.max(minC, Math.min(maxC, center));
  lastGapCenter = center;
  walls.push({ x: W + 80, w: 64, center, counted: false });
  nextGap = 320;
}

function gameOver() {
  state = 'dead';
  player.emoji = '😵';
  if (score > best) {
    best = score;
    localStorage.setItem('knobParkourBest', best);
  }
}

/* ================= 渲染 ================= */
const stars = Array.from({ length: 50 }, () => ({
  x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4,
}));

function render() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#101024');
  g.addColorStop(1, '#1f1f3a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (const s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.font = `46px ${EMOJI_FONT}`;
  for (const c of clouds) ctx.fillText('☁️', c.x, c.y + 30);

  // 石墙（上下两段，缝隙边缘描金）
  for (const w of walls) {
    const gapTop = w.center - gapH / 2;
    const gapBottom = w.center + gapH / 2;
    ctx.fillStyle = '#2f2f4a';
    ctx.fillRect(w.x, 0, w.w, gapTop);
    ctx.fillRect(w.x, gapBottom, w.w, H - gapBottom);
    ctx.fillStyle = '#7ecbff';
    ctx.fillRect(w.x, gapTop - 4, w.w, 4);
    ctx.fillRect(w.x, gapBottom, w.w, 4);
    // 墙面纹理
    ctx.strokeStyle = '#3d3d5c';
    ctx.lineWidth = 1;
    for (let y = 26; y < gapTop - 10; y += 34) {
      ctx.beginPath(); ctx.moveTo(w.x + 8, y); ctx.lineTo(w.x + w.w - 8, y); ctx.stroke();
    }
    for (let y = gapBottom + 30; y < H - 10; y += 34) {
      ctx.beginPath(); ctx.moveTo(w.x + 8, y); ctx.lineTo(w.x + w.w - 8, y); ctx.stroke();
    }
  }

  // 角色（按高度差倾斜，模拟爬升/俯冲）
  ctx.save();
  ctx.translate(PLAYER_X, player.y);
  const tilt = Math.max(-0.5, Math.min(0.5, (player.targetY - player.y) / 220));
  ctx.rotate(tilt);
  ctx.font = `46px ${EMOJI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(player.emoji, 0, 0);
  ctx.restore();

  // 分数
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 22px "Segoe UI",sans-serif';
  ctx.fillStyle = '#7ecbff';
  ctx.fillText(`分数 ${score}`, W - 20, 16);
  ctx.font = '14px "Segoe UI",sans-serif';
  ctx.fillStyle = '#888';
  ctx.fillText(`最高 ${best}`, W - 20, 44);

  if (state !== 'playing') drawOverlay();
}

function drawOverlay() {
  ctx.fillStyle = 'rgba(10,10,25,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state === 'ready') {
    ctx.fillStyle = '#7ecbff';
    ctx.font = 'bold 34px "Segoe UI",sans-serif';
    ctx.fillText('🎮 旋钮跑酷', W / 2, H / 2 - 60);
    ctx.fillStyle = '#ccc';
    ctx.font = '18px "Segoe UI",sans-serif';
    ctx.fillText('转动电位器控制飞行高度，穿过石墙缝隙', W / 2, H / 2 - 12);
    ctx.fillText('数值 0 = 最低，1023 = 最高', W / 2, H / 2 + 20);
    ctx.fillStyle = '#888';
    ctx.font = '15px "Segoe UI",sans-serif';
    ctx.fillText('转动旋钮 / 按空格 / 点击画面 开始', W / 2, H / 2 + 62);
  } else {
    ctx.fillStyle = '#ff8a8a';
    ctx.font = 'bold 36px "Segoe UI",sans-serif';
    ctx.fillText('游戏结束', W / 2, H / 2 - 48);
    ctx.fillStyle = '#7ecbff';
    ctx.font = 'bold 24px "Segoe UI",sans-serif';
    ctx.fillText(`得分 ${score}    最高 ${best}`, W / 2, H / 2 + 2);
    ctx.fillStyle = '#888';
    ctx.font = '15px "Segoe UI",sans-serif';
    ctx.fillText('转动旋钮 / 按空格 / 点击画面 重新开始', W / 2, H / 2 + 48);
  }
}

requestAnimationFrame(loop);

/* ================= 输入方式 1：Web Serial 连接 Arduino ================= */
let serialConnected = false;
let lastSerialV = null;

async function connect() {
  if (!('serial' in navigator)) {
    statusEl.textContent = '当前浏览器不支持 Web Serial，请用 Chrome/Edge 并通过 localhost 或 https 打开（可用鼠标/键盘试玩）';
    return;
  }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    serialConnected = true;
    statusEl.textContent = '已连接，转动旋钮开始游戏！';
    connectBtn.disabled = true;

    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    const reader = decoder.readable.getReader();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let idx;
      while ((idx = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        const num = parseInt(line, 10);
        if (isNaN(num)) continue;
        const v = Math.min(1023, Math.max(0, num));
        // 转动幅度够大才算一次"开始"信号，避免刚连接时的读数直接开局
        const startSignal = lastSerialV !== null && Math.abs(v - lastSerialV) > 40;
        handleValue(v, startSignal);
        lastSerialV = v;
      }
    }
  } catch (err) {
    statusEl.textContent = '连接失败：' + err.message;
    connectBtn.disabled = false;
  }
}
connectBtn.addEventListener('click', connect);

/* ================= 输入方式 2：鼠标 / 键盘（演示） ================= */
// 上下移动鼠标 = 转动旋钮（未连接硬件时，开局后生效）
document.addEventListener('mousemove', (e) => {
  if (serialConnected) return;
  const v = Math.round((1 - e.clientY / window.innerHeight) * 1023);
  handleValue(v, false);  // 鼠标只控制，不开局
});

// 按住 ↑/↓ 模拟旋钮转动
let virtualValue = 512;
const keysHeld = {};
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) startGame();
  }
  if (e.code === 'ArrowUp' || e.code === 'ArrowDown') {
    e.preventDefault();
    keysHeld[e.code] = true;
    if (state !== 'playing') startGame();
  }
});
window.addEventListener('keyup', (e) => { keysHeld[e.code] = false; });

(function keyboardSim() {
  if (!serialConnected) {
    if (keysHeld['ArrowUp'])   handleValue(Math.min(1023, virtualValue += 12), false);
    if (keysHeld['ArrowDown']) handleValue(Math.max(0,    virtualValue -= 12), false);
  }
  requestAnimationFrame(keyboardSim);
})();

canvas.addEventListener('click', () => { if (state !== 'playing') startGame(); });
</script>
</body>
</html>
