<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>光线跑酷 · 遮挡跳跃游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #1a1a2e;
    color: #eee;
    font-family: "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 40px;
  }
  h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 14px; }
  h1 .sub { font-size: 14px; color: #888; letter-spacing: 0; margin-left: 8px; font-weight: normal; }
  .game-wrap { width: min(900px, 94vw); }
  canvas {
    width: 100%;
    display: block;
    border-radius: 12px;
    border: 1px solid #333;
    background: #16162a;
    cursor: pointer;
  }
  .panel { margin-top: 16px; text-align: center; }
  .value { font-size: 32px; font-weight: bold; color: #ffd76a; font-variant-numeric: tabular-nums; }
  .bar-zone { position: relative; width: min(420px, 80vw); margin: 14px auto 0; }
  .bar { position: relative; height: 12px; background: #333; border-radius: 6px; overflow: hidden; }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd76a, #ff9d2e);
    transition: width 0.08s;
  }
  /* 阈值刻度线：44% ≈ 450/1023，88% ≈ 900/1023 */
  .marker {
    position: absolute;
    top: -4px;
    width: 2px;
    height: 20px;
    background: #999;
    transform: translateX(-1px);
  }
  .marker.m2 { background: #ff5252; }
  .bar-labels { position: relative; height: 18px; margin-top: 4px; font-size: 12px; color: #888; }
  .bar-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .bar-labels .l2 { color: #ff8a8a; }
  button {
    margin-top: 14px;
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #ffd76a;
    color: #1a1a2e;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #ffcf40; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 8px; font-size: 14px; color: #888; }
  .hint { margin-top: 10px; font-size: 13px; color: #666; line-height: 1.7; }
</style>
</head>
<body>

<h1>🏃 光线跑酷<span class="sub">遮住传感器，跳！</span></h1>

<div class="game-wrap"><canvas id="game" width="900" height="360"></canvas></div>

<div class="panel">
  <div>传感器数值：<span class="value" id="val">--</span></div>
  <div class="bar-zone">
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="marker" style="left:44%"></div>
    <div class="marker m2" style="left:88%"></div>
    <div class="bar-labels">
      <span style="left:44%">跳 450</span>
      <span class="l2" style="left:88%">二段跳 900</span>
    </div>
  </div>
  <button id="connectBtn">连接 Arduino</button>
  <div id="status">未连接</div>
  <div class="hint">
    玩法：数值 &gt; 450 跳跃，&gt; 900 触发二段跳；🌵 一段跳即可越过，🌲 必须二段跳。<br>
    未连接硬件时：按 <b>空格</b> / 点击画面跳跃（空中再按一次 = 二段跳），或快速向右移动鼠标越过刻度。
  </div>
</div>

<script>
'use strict';

/* ================= 可调参数 ================= */
const TH_JUMP      = 450;   // 数值超过它 → 一段跳
const TH_DOUBLE    = 900;   // 数值超过它 → 二段跳
const REARM_JUMP   = 420;   // 数值回落到该值以下，跳跃触发重新待命（防止一直遮挡时反复触发）
const REARM_DOUBLE = 860;

const GRAVITY  = 3000;    // px/s²
const V_JUMP   = -800;    // 一段跳初速度：约跳 107px 高，能过 🌵 过不了 🌲
const V_DOUBLE = -1050;   // 二段跳初速度：约 184px 高，可过 🌲

const W = 900, H = 360, GROUND_Y = 306;
const PLAYER_X = 100;

/* ================= 画布 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

/* ================= DOM ================= */
const valEl = document.getElementById('val');
const barFill = document.getElementById('barFill');
const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connectBtn');

/* ================= 游戏状态 ================= */
let state = 'ready';  // ready | playing | dead
let player, obstacles, clouds;
let speed, distance, score;
let best = +(localStorage.getItem('lightParkourBest') || 0);
let distSinceSpawn, nextGap;

function resetWorld() {
  player = { y: 0, vy: 0, onGround: true, usedDouble: false, emoji: '🏃' };
  obstacles = [];
  clouds = [
    { x: 200, y: 60, s: 0.15 },
    { x: 560, y: 40, s: 0.10 },
    { x: 800, y: 90, s: 0.20 },
  ];
  speed = 320; distance = 0; score = 0;
  distSinceSpawn = 0; nextGap = 500;
}
resetWorld();

/* ================= 跳跃入口 =================
   level 1 = 一段跳（>450），level 2 = 二段跳（>900） */
function doJump(level) {
  if (state === 'dead') restart();
  if (state === 'ready') state = 'playing';

  if (level === 1) {
    if (player.onGround) {
      player.vy = V_JUMP;
      player.onGround = false;
    }
  } else {
    // 二段跳：在地上直接起一个大跳；在空中且未用过二段跳时给一个向上冲量
    if (player.onGround) {
      player.vy = V_DOUBLE;
      player.onGround = false;
      player.usedDouble = true;
    } else if (!player.usedDouble) {
      player.vy = V_DOUBLE;
      player.usedDouble = true;
    }
  }
}

function restart() {
  resetWorld();
  state = 'playing';
}

/* ================= 传感器数值处理（带迟滞的上升沿触发） ================= */
let jumpArmed = true, doubleArmed = true;
// allowTrigger：鼠标演示模式下未开局时只更新显示，避免误触发开局
function handleSensorValue(v, allowTrigger = true) {
  valEl.textContent = v;
  barFill.style.width = (v / 1023 * 100) + '%';
  barFill.style.background = v > TH_DOUBLE
    ? '#ff5252'
    : v > TH_JUMP
      ? '#ff9d2e'
      : 'linear-gradient(90deg,#ffd76a,#ff9d2e)';

  if (v < REARM_JUMP) jumpArmed = true;
  if (v < REARM_DOUBLE) doubleArmed = true;
  if (!allowTrigger) return;
  if (v > TH_JUMP && jumpArmed)     { jumpArmed = false;   doJump(1); }
  if (v > TH_DOUBLE && doubleArmed) { doubleArmed = false; doJump(2); }
}

/* ================= 主循环 ================= */
let lastT = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 1000 || 0, 0.033);
  lastT = t;
  if (state === 'playing') update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  speed = Math.min(320 + distance * 0.012, 700);  // 随距离逐渐加速
  distance += speed * dt;
  score = Math.floor(distance * 0.02);

  // 玩家物理
  if (!player.onGround) {
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.y <= 0) {
      player.y = 0; player.vy = 0;
      player.onGround = true;
      player.usedDouble = false;  // 落地后二段跳恢复
    }
  }

  // 障碍物生成与移动
  distSinceSpawn += speed * dt;
  if (distSinceSpawn > nextGap) { spawnObstacle(); distSinceSpawn = 0; }
  for (const o of obstacles) o.x -= speed * dt;
  obstacles = obstacles.filter(o => o.x > -120);

  for (const c of clouds) {
    c.x -= speed * c.s * dt;
    if (c.x < -80) { c.x = W + 60; c.y = 30 + Math.random() * 70; }
  }

  // 碰撞检测（判定盒比 emoji 略小，手感更宽容）
  const pb = { x: PLAYER_X - 14, y: GROUND_Y - player.y - 40, w: 28, h: 40 };
  for (const o of obstacles) {
    const ob = { x: o.x - o.w / 2 + 4, y: GROUND_Y - o.h, w: o.w - 8, h: o.h };
    if (pb.x < ob.x + ob.w && pb.x + pb.w > ob.x &&
        pb.y < ob.y + ob.h && pb.y + pb.h > ob.y) {
      gameOver();
      break;
    }
  }
}

function spawnObstacle() {
  const tall = distance > 600 && Math.random() < 0.35;
  if (tall) {
    obstacles.push({ x: W + 80, w: 58, h: 128, emoji: '🌲', fs: 150 });
    nextGap = speed * (1.1 + Math.random() * 0.6);  // 高障碍后留足落地时间
  } else {
    obstacles.push({ x: W + 80, w: 34, h: 54, emoji: '🌵', fs: 58 });
    nextGap = speed * (0.65 + Math.random() * 0.5);
  }
}

function gameOver() {
  state = 'dead';
  player.emoji = '😵';
  if (score > best) {
    best = score;
    localStorage.setItem('lightParkourBest', best);
  }
}

/* ================= 渲染 ================= */
const stars = Array.from({ length: 40 }, () => ({
  x: Math.random() * W, y: Math.random() * 200, r: Math.random() * 1.6 + 0.4,
}));

function render() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#101024');
  g.addColorStop(1, '#1f1f3a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (const s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.font = `46px ${EMOJI_FONT}`;
  for (const c of clouds) ctx.fillText('☁️', c.x, c.y + 30);

  // 地面与滚动的地面刻度
  ctx.strokeStyle = '#3d3d5c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
  ctx.strokeStyle = '#2c2c44';
  for (let x = -(distance % 46); x < W; x += 46) {
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 8); ctx.lineTo(x - 8, GROUND_Y + 14); ctx.stroke();
  }

  // 障碍物
  for (const o of obstacles) {
    ctx.font = `${o.fs}px ${EMOJI_FONT}`;
    ctx.fillText(o.emoji, o.x, GROUND_Y + 2);
  }

  // 玩家（空中按速度倾斜）
  ctx.save();
  ctx.translate(PLAYER_X, GROUND_Y - player.y + 2);
  if (!player.onGround) ctx.rotate(Math.max(-0.35, Math.min(0.35, player.vy / 3200)));
  ctx.font = `48px ${EMOJI_FONT}`;
  ctx.fillText(player.emoji, 0, 0);
  ctx.restore();

  // 分数
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 22px "Segoe UI",sans-serif';
  ctx.fillStyle = '#ffd76a';
  ctx.fillText(`分数 ${score}`, W - 20, 16);
  ctx.font = '14px "Segoe UI",sans-serif';
  ctx.fillStyle = '#888';
  ctx.fillText(`最高 ${best}`, W - 20, 44);

  if (state !== 'playing') drawOverlay();
}

function drawOverlay() {
  ctx.fillStyle = 'rgba(10,10,25,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state === 'ready') {
    ctx.fillStyle = '#ffd76a';
    ctx.font = 'bold 34px "Segoe UI",sans-serif';
    ctx.fillText('🏃 光线跑酷', W / 2, H / 2 - 60);
    ctx.fillStyle = '#ccc';
    ctx.font = '18px "Segoe UI",sans-serif';
    ctx.fillText('用手遮挡光线传感器：数值 > 450 跳跃，> 900 二段跳', W / 2, H / 2 - 12);
    ctx.fillText('🌵 一段跳可以越过     🌲 需要二段跳', W / 2, H / 2 + 20);
    ctx.fillStyle = '#888';
    ctx.font = '15px "Segoe UI",sans-serif';
    ctx.fillText('遮挡传感器 / 按空格 / 点击画面 开始', W / 2, H / 2 + 62);
  } else {
    ctx.fillStyle = '#ff8a8a';
    ctx.font = 'bold 36px "Segoe UI",sans-serif';
    ctx.fillText('游戏结束', W / 2, H / 2 - 48);
    ctx.fillStyle = '#ffd76a';
    ctx.font = 'bold 24px "Segoe UI",sans-serif';
    ctx.fillText(`得分 ${score}    最高 ${best}`, W / 2, H / 2 + 2);
    ctx.fillStyle = '#888';
    ctx.font = '15px "Segoe UI",sans-serif';
    ctx.fillText('遮挡传感器 / 按空格 / 点击画面 重新开始', W / 2, H / 2 + 48);
  }
}

requestAnimationFrame(loop);

/* ================= 输入方式 1：Web Serial 连接 Arduino ================= */
let serialConnected = false;

async function connect() {
  if (!('serial' in navigator)) {
    statusEl.textContent = '当前浏览器不支持 Web Serial，请用 Chrome/Edge 并通过 localhost 或 https 打开（可用空格/鼠标试玩）';
    return;
  }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    serialConnected = true;
    statusEl.textContent = '已连接，遮挡传感器开始游戏！';
    connectBtn.disabled = true;

    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    const reader = decoder.readable.getReader();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      let idx;
      while ((idx = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        const num = parseInt(line, 10);
        if (!isNaN(num)) handleSensorValue(Math.min(1023, Math.max(0, num)));
      }
    }
  } catch (err) {
    statusEl.textContent = '连接失败：' + err.message;
    connectBtn.disabled = false;
  }
}
connectBtn.addEventListener('click', connect);

/* ================= 输入方式 2：键盘 / 鼠标（演示） ================= */
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    // 键盘模拟：在地上 = 一段跳，在空中 = 二段跳
    doJump(player.onGround ? 1 : 2);
  }
});
canvas.addEventListener('click', () => doJump(player.onGround ? 1 : 2));

// 鼠标横向位置模拟传感器值（未连接硬件时）
document.addEventListener('mousemove', (e) => {
  if (serialConnected) return;
  const v = Math.round(e.clientX / window.innerWidth * 1023);
  handleSensorValue(v, state === 'playing');
});
</script>
</body>
</html>
